<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Центр уведомлений - Кредитная система</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="wrap">
        <header class="topbar">
            <div class="left">
                <h1>Центр уведомлений - Кредитная система</h1>
                <div class="websocket-line">
                    <p class="sub">WebSocket: ws://localhost:8084/ws/notifications</p>
                    <output id="pingStatus" class="ping-value">Пинг: –</output>
                </div>
            </div>
            <div class="right">
                <output id="status" class="status bad">WS: Отключено</output>
                <button id="clearBtn" class="btn" type="button">Очистить историю</button>
            </div>
        </header>

        <main class="panel">
            <header class="panelHead">
                <h2 class="panelTitle">Лента событий</h2>
                <div class="panelRight">
                    <fieldset class="filter-options">
                        <legend class="visually-hidden">Фильтры событий</legend>
                        <div class="filter-option">
                            <input type="checkbox" id="filterAssessment" value="ASSESSMENT_COMPLETED" checked>
                            <label for="filterAssessment">Оценка кредитоспособности</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="filterOffer" value="OFFER_GENERATED" checked>
                            <label for="filterOffer">Кредитные предложения</label>
                        </div>
                    </fieldset>
                    <output id="counter" class="counter">Событий: 0</output>
                </div>
            </header>

            <section id="feed" class="feed" aria-live="polite" aria-label="Лента уведомлений">
                <p id="empty" class="empty">Событий пока нет. Ожидание уведомлений...</p>
            </section>
        </main>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const feedEl = document.getElementById('feed');
        const emptyEl = document.getElementById('empty');
        const counterEl = document.getElementById('counter');
        const clearBtn = document.getElementById('clearBtn');
        const pingStatusEl = document.getElementById('pingStatus');

        let socket;
        let count = 0;
        let pingInterval;
        let subscriptions = new Set(['ASSESSMENT_COMPLETED', 'OFFER_GENERATED']);

        function updateCounter() {
            counterEl.textContent = `Событий: ${count}`;
            emptyEl.style.display = count === 0 ? 'block' : 'none';
        }

        function updatePingStatus(latency) {
            if (latency !== null && latency !== undefined) {
                pingStatusEl.textContent = `Пинг: ${latency} мс`;
                pingStatusEl.classList.add('active');
            } else {
                pingStatusEl.textContent = 'Пинг: ожидание...';
                pingStatusEl.classList.remove('active');
            }
        }

        function resetPingStatus() {
            pingStatusEl.textContent = 'Пинг: —';
            pingStatusEl.classList.remove('active');
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '—';
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatMoney(amount) {
            if (amount === null || amount === undefined) return '—';
            const num = Number(amount);
            if (Number.isNaN(num)) return escapeHtml(String(amount));
            return num.toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' ₽';
        }

        function formatMonths(months) {
            if (months === null || months === undefined) return '—';
            const num = Number(months);
            if (Number.isNaN(num)) return escapeHtml(String(months));

            const lastDigit = num % 10;
            const lastTwoDigits = num % 100;

            if (lastTwoDigits >= 11 && lastTwoDigits <= 19) {
                return `${num} месяцев`;
            }
            if (lastDigit === 1) {
                return `${num} месяц`;
            }
            if (lastDigit >= 2 && lastDigit <= 4) {
                return `${num} месяца`;
            }
            return `${num} месяцев`;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            if (Number.isNaN(date.getTime())) return escapeHtml(String(dateStr));

            return date.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getNow() {
            return new Date().toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function addCard(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent.trim();
            const card = wrapper.firstElementChild;

            card.style.opacity = '0';
            card.style.transform = 'translateY(-10px)';
            feedEl.prepend(card);

            requestAnimationFrame(() => {
                card.style.transition = 'all 0.3s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            });

            count++;
            updateCounter();
        }

        function renderAssessment(message) {
            const data = message.data || {};
            const approved = !!data.approved;

            const cardClass = approved ? 'approved' : 'declined';
            const statusPill = approved
                ? '<span class="pill ok">ОДОБРЕНО</span>'
                : '<span class="pill bad">ОТКЛОНЕНО</span>';

            const reasons = Array.isArray(data.rejectionReasons) ? data.rejectionReasons : [];
            const reasonsBlock = !approved && reasons.length > 0 ? `
                <div class="reasons">
                    <strong class="k">Причины отклонения:</strong>
                    <ul>${reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul>
                </div>
            ` : '';
            addCard(`
                <article class="card ${cardClass}">
                    <header class="meta">
                        <span class="type">Оценка кредитоспособности</span>
                        <time class="time" datetime="${message.timestamp || ''}">${formatDateTime(message.timestamp) || getNow()}</time>
                    </header>
                    <h3 class="title">Результат оценки ${statusPill}</h3>
                    <dl class="kv">
                        <dt class="k">ID запроса</dt><dd class="v">${escapeHtml(data.requestId)}</dd>
                        <dt class="k">ID заявки</dt><dd class="v">${escapeHtml(data.applicationId)}</dd>
                        <dt class="k">ID клиента</dt><dd class="v">${escapeHtml(data.clientId)}</dd>
                        <dt class="k">Кредитный скор</dt><dd class="v">${escapeHtml(data.creditScore)}</dd>
                        <dt class="k">Уровень риска</dt><dd class="v">${escapeHtml(data.riskLevel)}</dd>
                    </dl>
                    ${reasonsBlock}
                </article>
            `);
        }

        function renderOffer(message) {
            const data = message.data || {};

            addCard(`
                <article class="card offer">
                    <header class="meta">
                        <span class="type">Кредитное предложение</span>
                        <time class="time" datetime="${message.timestamp || ''}">${formatDateTime(message.timestamp) || getNow()}</time>
                    </header>
                    <h3 class="title">Сформировано предложение <span class="pill info">ОФФЕР</span></h3>
                    <dl class="kv">
                        <dt class="k">ID запроса</dt><dd class="v">${escapeHtml(data.requestId)}</dd>
                        <dt class="k">ID клиента</dt><dd class="v">${escapeHtml(data.clientId)}</dd>
                        <dt class="k">ID заявки</dt><dd class="v">${escapeHtml(data.applicationId)}</dd>
                        <dt class="k">ID продукта</dt><dd class="v">${escapeHtml(data.productId)}</dd>
                        <dt class="k">Одобренная сумма</dt><dd class="v">${formatMoney(data.approvedAmount)}</dd>
                        <dt class="k">Срок кредита</dt><dd class="v">${formatMonths(data.termMonths)}</dd>
                        <dt class="k">Годовая ставка (APR)</dt><dd class="v">${escapeHtml(data.annualPercentageRate)}%</dd>
                        <dt class="k">Ежемесячный платёж</dt><dd class="v">${formatMoney(data.monthlyPayment)}</dd>
                        <dt class="k">Действует до</dt><dd class="v">${formatDateTime(data.expiresAt)}</dd>
                    </dl>
                </article>
            `);
        }

        function sendSubscriptions() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const message = {
                    cmd: 'SUBSCRIBE',
                    types: Array.from(subscriptions)
                };
                socket.send(JSON.stringify(message));
                console.log('[WS] Sent subscriptions:', Array.from(subscriptions));
            }
        }

        function startPing() {
            if (pingInterval) {
                clearInterval(pingInterval);
            }

            pingInterval = setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const pingTime = Date.now();
                    const pingMessage = {
                        type: 'PING',
                        sentAt: pingTime
                    };
                    socket.send(JSON.stringify(pingMessage));
                    console.log('[WS] Sent PING at', pingTime);
                }
            }, 10000);
        }

        function stopPing() {
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
            resetPingStatus();
        }

        function connectWebSocket() {
            socket = new WebSocket('ws://localhost:8084/ws/notifications');

            socket.onopen = () => {
                statusEl.textContent = 'WS: Подключено';
                statusEl.classList.remove('bad');
                statusEl.classList.add('ok');
                console.log('[WebSocket] Соединение установлено');

                sendSubscriptions();
                startPing();
            };

            socket.onmessage = (event) => {
                console.log('[WebSocket] Получено сообщение:', event.data);

                let message;
                try {
                    message = JSON.parse(event.data);
                } catch (error) {
                    console.error('[WebSocket] Ошибка парсинга JSON:', error);
                    addCard(`
                        <article class="card declined">
                            <header class="meta">
                                <span class="type">Ошибка формата</span>
                                <time class="time">${getNow()}</time>
                            </header>
                            <h3 class="title">Некорректное сообщение</h3>
                            <p class="v">${escapeHtml(event.data.substring(0, 200))}</p>
                        </article>
                    `);
                    return;
                }

                // Handle PONG
                if (message.type === 'PONG') {
                    const latency = message.sentAt ? Date.now() - message.sentAt : null;
                    updatePingStatus(latency);
                    console.log('[WS] Received PONG, latency:', latency, 'ms');
                    return;
                }

                // Handle SUBSCRIBED confirmation
                if (message.type === 'SUBSCRIBED') {
                    console.log('[WS] Subscription confirmed:', message.types);
                    return;
                }

                switch (message.type) {
                    case 'ASSESSMENT_COMPLETED':
                        renderAssessment(message);
                        break;
                    case 'OFFER_GENERATED':
                        renderOffer(message);
                        break;
                    default:
                        console.warn('[WebSocket] Неизвестный тип события:', message.type);
                        addCard(`
                            <article class="card">
                                <header class="meta">
                                    <span class="type">${escapeHtml(message.type || 'UNKNOWN')}</span>
                                    <time class="time" datetime="${message.timestamp || ''}">${formatDateTime(message.timestamp) || getNow()}</time>
                                </header>
                                <h3 class="title">Необработанное событие</h3>
                                <pre class="v">${escapeHtml(JSON.stringify(message, null, 2).substring(0, 300))}</pre>
                            </article>
                        `);
                }
            };

            socket.onclose = (event) => {
                statusEl.textContent = 'Переподключение...';
                statusEl.classList.remove('ok');
                statusEl.classList.add('bad');
                console.log('[WebSocket] Соединение закрыто:', event.code, event.reason);
                stopPing();
                setTimeout(connectWebSocket, 2000);
            };

            socket.onerror = (error) => {
                statusEl.textContent = 'Ошибка соединения';
                statusEl.classList.remove('ok');
                statusEl.classList.add('bad');
                console.error('[WebSocket] Ошибка:', error);
            };
        }

        clearBtn.addEventListener('click', () => {
            const cards = feedEl.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.transition = 'all 0.2s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => card.remove(), 200);
            });
            count = 0;
            updateCounter();
            console.log('[UI] История очищена');
        });

        // Filter event listeners
        document.querySelectorAll('.filter-option input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const eventType = e.target.value;
                if (e.target.checked) {
                    subscriptions.add(eventType);
                } else {
                    subscriptions.delete(eventType);
                }
                console.log('[UI] Subscriptions updated:', Array.from(subscriptions));
                sendSubscriptions();
            });
        });

        updateCounter();
        connectWebSocket();
        console.log('[UI] Приложение запущено');
    </script>
</body>

</html>
